services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tdo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-32chars-min}
      POSTGRES_DB: ${POSTGRES_DB:-tdms}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://user:pass@db:5432/tdms}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@ivamaris.io}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-admin123}
      FIRST_ADMIN_FULL_NAME: ${FIRST_ADMIN_FULL_NAME:-System Administrator}
      MAIN_ADMIN_EMAIL: ${MAIN_ADMIN_EMAIL:-admin@ivamaris.io}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      # Модуль Vendors: SMTP для отправки email-кодов подтверждения
      # подрядчикам. Все значения — из окружения прода, дефолты пустые
      # (если SMTP_HOST пуст, сервис уходит в режим лог-заглушки).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@ivamaris.io}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_INSECURE: ${SMTP_INSECURE:-false}
      # Имя для EHLO/HELO (hostname или IP хостовой машины, напр. 192.168.11.237).
      # Без него Python шлёт внутренний docker-IP, который Exchange отвергает.
      SMTP_HELO: ${SMTP_HELO:-}
      # Корни хранилищ DCC (совпадают с томами ниже). Можно переопределить на
      # host bind-mount для надёжности и бэкапов (см. SYSADMIN_DEPLOY_RU §9).
      TDO_UPLOADS_ROOT: ${TDO_UPLOADS_ROOT:-/tmp/tdo_uploads}
      SMART_UPLOAD_ROOT: ${SMART_UPLOAD_ROOT:-/tmp/tdo_smart_upload}
      # Базовый URL фронта — нужен, чтобы собрать ссылку-приглашение
      # подрядчику в письме (например https://tdo.company.ru).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # Модуль FEED: AI-поиск по документации (OpenAI-совместимый API,
      # например Qwen/DashScope). Пусто — обычный полнотекстовый поиск.
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-qwen-plus}
      # FEED RAG-агент (LangGraph + Qdrant + локальные эмбеддинги bge-m3).
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-BAAI/bge-m3}
      RAG_RERANK: ${RAG_RERANK:-true}
      AGENT_MODEL: ${AGENT_MODEL:-qwen/qwen-2.5-72b-instruct:free}
    ports:
      - "8000:8000"
    volumes:
      # Все загруженные PDF ревизий лежат в /tmp/tdo_uploads внутри контейнера.
      # Без persistent volume они пропадают при каждой пересборке/пересоздании
      # контейнера — БД остаётся с битыми file_path, PDF возвращает 404.
      # Named volume сохраняет файлы при апдейтах backend.
      - tdo_uploads:/tmp/tdo_uploads
      # DOCchecker / smart-upload: РАНЬШЕ писал в /tmp без тома и терял файлы
      # при каждой пересборке. Теперь — свой persistent volume.
      - smart_upload:/tmp/tdo_smart_upload
      # Модуль Vendors: документы подрядчиков хранятся ОТДЕЛЬНО — свой volume.
      - vendor_uploads:/data/vendor_uploads
      # Модуль FEED: документация стадии FEED — свой volume.
      - feed_storage:/data/feed_storage
    depends_on:
      - db
      - redis
      - minio
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    # Порт наружу не публикуем — доступ только из backend по сети compose.

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  tdo_uploads:
  smart_upload:
  vendor_uploads:
  feed_storage:
  qdrant_data:
