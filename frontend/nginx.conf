# Прод-раздача фронта + прокси /api → backend (один origin, без CORS).
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Внутренняя система заказчика — просим поисковики её не индексировать.
    # robots.txt — вежливая просьба нормальным ботам; жёсткая блокировка
    # агрессивных сканеров/ботов сделана на уровне Caddy (../Caddyfile).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # FEED принимает файлы до 200MB — лимит с запасом.
    client_max_body_size 300m;

    # .mjs нет в дефолтном mime.types nginx → отдавался octet-stream, и
    # браузер (с nosniff) отказывался импортировать ES-модуль — ломался
    # PDF-вьюер (pdf.worker.min-*.mjs: "Failed to fetch dynamically
    # imported module"). Regex-location приоритетнее префиксного /assets/.
    location ~ \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    # Статика прод-сборки: hashed-имена → кэш навсегда, index.html — никогда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Загрузка/парсинг больших PDF занимает время.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
